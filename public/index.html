<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vrows</title>
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --text: #151a24; --muted: #6a7384;
    --line: #dde1e8; --accent: #3b6cf6; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0f18; --surface: #141a27; --text: #e8ecf4; --muted: #8b95a8;
      --line: #263045; --accent: #5b86ff; --accent-text: #0b0f18;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  header {
    display: flex; gap: 6px; align-items: center; padding: 8px 10px;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  button {
    font: inherit; color: var(--text); background: transparent; border: 0;
    width: 40px; height: 40px; border-radius: 10px; font-size: 20px; cursor: pointer; flex: none;
  }
  button:hover, button:focus-visible { background: var(--bg); }
  #url {
    flex: 1; min-width: 0; height: 40px; padding: 0 14px; font: inherit; font-size: 16px;
    color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 20px; outline: none;
  }
  #url:focus { border-color: var(--accent); }
  #bar { height: 2px; background: var(--accent); width: 0; transition: width .3s; }
  #bar.on { width: 70%; transition: width 8s cubic-bezier(.1,.7,.3,1); }
  main { flex: 1; position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #start {
    position: absolute; inset: 0; overflow: auto; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; text-align: center; gap: 8px;
  }
  #start[hidden] { display: none; }
  #start h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  #start p { margin: 0 0 16px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 420px; }
  .links button {
    width: auto; height: auto; padding: 10px 16px; font-size: 15px;
    background: var(--surface); border: 1px solid var(--line);
  }
  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); padding: 20px; width: min(92vw, 360px); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h2 { margin: 0 0 4px; font-size: 18px; }
  dialog p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  dialog input { width: 100%; height: 44px; padding: 0 12px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
  dialog .save { width: 100%; margin-top: 12px; height: 44px; font-size: 16px; background: var(--accent); color: var(--accent-text); }
  #menu { position: relative; }
  #dlcount { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); font-size: 11px; line-height: 16px; font-weight: 700; }
  #dlcount:empty { display: none; }
  #menu-pop { position: fixed; top: calc(env(safe-area-inset-top) + 54px); right: 10px; z-index: 6; min-width: 190px; padding: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  #menu-pop[hidden] { display: none; }
  #menu-pop button { display: block; width: 100%; height: auto; padding: 11px 12px; text-align: left; font-size: 15px; border-radius: 9px; }
  #histq { margin-bottom: 10px; }
  #histlist { list-style: none; margin: 0 0 12px; padding: 0; max-height: 52vh; overflow: auto; }
  #histlist .day { margin: 10px 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #histlist li.row { display: flex; align-items: center; gap: 4px; border-radius: 10px; }
  #histlist li.row:hover { background: var(--bg); }
  #histlist .open { flex: 1; min-width: 0; width: auto; height: auto; padding: 8px 8px; text-align: left; font-size: 14px; border-radius: 10px; }
  #histlist .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #histlist .s { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
  #histlist .del { flex: none; width: 34px; height: 34px; font-size: 14px; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; margin: 24px 0; font-size: 14px; }
  .histbar { display: flex; gap: 8px; }
  .histbar button { flex: 1; width: auto; height: 44px; font-size: 15px; border: 1px solid var(--line); border-radius: 10px; }
  .offrow { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .offrow input { width: 18px; height: 18px; }
  #dllist { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; max-height: 50vh; overflow: auto; }
  #dllist li { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  #dllist .name { font-size: 14px; word-break: break-all; }
  #dllist .meta { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
  #dllist .acts { display: flex; gap: 8px; }
  #dllist a, #dllist button { width: auto; height: auto; padding: 8px 14px; font-size: 14px; border-radius: 8px; text-decoration: none;
    border: 1px solid var(--line); color: var(--text); background: var(--surface); }
  #dllist a.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  #dlclose { width: 100%; height: 44px; font-size: 16px; border: 1px solid var(--line); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); max-width: 90vw; padding: 10px 16px;
    background: var(--text); color: var(--bg); border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 5; }
  #toast.on { opacity: .95; transform: translate(-50%, 0); }
  #err { color: #d64545; font-size: 14px; min-height: 20px; margin: 6px 0 0; }
</style>
</head>
<body>
<header>
  <button id="back" aria-label="Back">‹</button>
  <button id="fwd" aria-label="Forward">›</button>
  <button id="reload" aria-label="Reload">↻</button>
  <input id="url" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search or enter address" aria-label="Address">
  <button id="menu" aria-label="Menu" aria-haspopup="true">⋮<span id="dlcount"></span></button>
</header>
<div id="menu-pop" role="menu" hidden>
  <button id="m-home" role="menuitem">Home</button>
  <button id="m-hist" role="menuitem">History</button>
  <button id="m-dl" role="menuitem" hidden>Save media from this page</button>
</div>
<div id="bar"></div>
<main>
  <iframe id="frame" title="Page" allow="fullscreen" referrerpolicy="same-origin" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"></iframe>
  <section id="start">
    <h1>Vrows</h1>
    <p>Type an address or search above.</p>
    <div class="links">
      <button data-go="https://en.wikipedia.org">Wikipedia</button>
      <button data-go="https://www.bbc.com/news">BBC News</button>
      <button data-go="https://lobste.rs">Lobsters</button>
    </div>
  </section>
</main>

<div id="toast" role="status"></div>
<dialog id="dldlg">
  <h2>Save from this page</h2>
  <p>Plain video and audio files found on the page.</p>
  <ul id="dllist"></ul>
  <button id="dlclose" type="button">Close</button>
</dialog>
<dialog id="histdlg">
  <h2>History</h2>
  <p>Saved only on this device.</p>
  <input id="histq" type="search" placeholder="Search history" autocomplete="off">
  <label class="offrow"><input id="histoff" type="checkbox"> Don't save history</label>
  <ul id="histlist"></ul>
  <div class="histbar"><button id="histclear" type="button">Clear all</button><button id="histclose" type="button">Close</button></div>
</dialog>
<dialog id="keydlg">
  <form id="keyform">
    <h2>Access key</h2>
    <p>Enter the key you set for this proxy.</p>
    <input id="keyin" type="password" autocomplete="off" placeholder="Access key" required>
    <p id="err"></p>
    <button class="save" type="submit">Save</button>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const frame = $('frame'), input = $('url'), start = $('start'), bar = $('bar'), dlg = $('keydlg');
const proxyUrl = (u) => {
  const x = new URL(u);
  return '/p/' + x.protocol.slice(0, -1) + '/' + x.host + x.pathname + x.search + x.hash;
};
const searchUrl = (q) => '/api/search?q=' + encodeURIComponent(q);

function normalize(v) {
  v = v.trim();
  if (!v) return null;
  if (/^https?:\/\//i.test(v)) return { site: v };
  if (!/\s/.test(v) && /^[^\s/]+\.[^\s/]{2,}(\/.*)?$/.test(v)) return { site: 'https://' + v };
  return { query: v };
}

// Plain media files the open page is using (reported by the page script)
let media = [];
function setMedia(list) {
  media = Array.isArray(list) ? list.filter((m) => m && typeof m.url === 'string') : [];
  $('m-dl').hidden = media.length === 0;
  $('dlcount').textContent = media.length || '';
}
function fileName(u, kind) {
  try {
    const n = decodeURIComponent(new URL(u).pathname.split('/').filter(Boolean).pop() || '');
    if (n) return n;
  } catch {}
  return kind === 'audio' ? 'audio' : 'video';
}
function showMedia() {
  const ul = $('dllist');
  ul.replaceChildren();
  for (const m of media) {
    const li = document.createElement('li');
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = fileName(m.url, m.kind);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = m.kind === 'stream' ? 'Streaming playlist: not a single file' : m.kind === 'audio' ? 'Audio file' : 'Video file';
    const acts = document.createElement('div');
    acts.className = 'acts';
    if (m.kind !== 'stream') {
      const a = document.createElement('a');
      a.className = 'primary';
      a.textContent = 'Download';
      a.href = proxyUrl(m.url);
      a.download = fileName(m.url, m.kind);
      acts.append(a);
    }
    const copy = document.createElement('button');
    copy.type = 'button';
    copy.textContent = 'Copy link';
    copy.onclick = async () => { try { await navigator.clipboard.writeText(m.url); toast('Link copied'); } catch { toast('Could not copy'); } };
    acts.append(copy);
    li.append(name, meta, acts);
    ul.append(li);
  }
  $('dldlg').showModal();
}
$('dlclose').onclick = () => $('dldlg').close();

// Browsing history, kept only in this browser's localStorage
const HKEY = 'vrows-history', HOFF = 'vrows-history-off', HMAX = 500;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const loadHistory = () => {
  try { const a = JSON.parse(store.get(HKEY) || '[]'); return Array.isArray(a) ? a : []; } catch { return []; }
};
const saveHistory = (a) => store.set(HKEY, JSON.stringify(a.slice(0, HMAX)));

function recordVisit(url, title) {
  if (!url || store.get(HOFF) === '1') return;
  const a = loadHistory();
  const now = Date.now();
  if (a[0] && a[0].u === url) {
    if (title) a[0].t = title;
    a[0].at = now;
  } else {
    a.unshift({ u: url, t: title || '', at: now, s: /^https?:\/\//i.test(url) ? 0 : 1 });
  }
  saveHistory(a);
}

function dayLabel(ts) {
  const day = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const diff = Math.round((day(new Date()) - day(new Date(ts))) / 864e5);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}

function hostOf(u) {
  try { const x = new URL(u); return x.host + (x.pathname !== '/' ? x.pathname : ''); } catch { return u; }
}

function renderHistory() {
  const q = $('histq').value.trim().toLowerCase();
  const ul = $('histlist');
  ul.replaceChildren();
  const items = loadHistory().filter((e) => !q || (e.t + ' ' + e.u).toLowerCase().includes(q)).slice(0, 200);
  if (!items.length) {
    const p = document.createElement('li');
    p.className = 'empty';
    p.textContent = q ? 'Nothing matches.' : 'No history yet.';
    ul.append(p);
    return;
  }
  let lastDay = '';
  for (const e of items) {
    const label = dayLabel(e.at);
    if (label !== lastDay) {
      const d = document.createElement('li');
      d.className = 'day';
      d.textContent = label;
      ul.append(d);
      lastDay = label;
    }
    const li = document.createElement('li');
    li.className = 'row';
    const open = document.createElement('button');
    open.type = 'button';
    open.className = 'open';
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = e.s ? e.u : e.t || hostOf(e.u);
    const s = document.createElement('span');
    s.className = 's';
    s.textContent = (e.s ? 'Search' : hostOf(e.u)) + ' · ' + new Date(e.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    open.append(t, s);
    open.onclick = () => { $('histdlg').close(); go(e.u); };
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.setAttribute('aria-label', 'Remove');
    del.textContent = '✕';
    del.onclick = () => {
      saveHistory(loadHistory().filter((x) => !(x.at === e.at && x.u === e.u)));
      renderHistory();
    };
    li.append(open, del);
    ul.append(li);
  }
}

function showHistory() {
  $('histq').value = '';
  $('histoff').checked = store.get(HOFF) === '1';
  renderHistory();
  $('histdlg').showModal();
}
$('histq').addEventListener('input', renderHistory);
$('histoff').addEventListener('change', (e) => store.set(HOFF, e.target.checked ? '1' : '0'));
$('histclose').onclick = () => $('histdlg').close();
$('histclear').onclick = () => {
  if (!loadHistory().length || !confirm('Clear all history?')) return;
  saveHistory([]);
  renderHistory();
  toast('History cleared');
};

// Menu
const pop = $('menu-pop');
$('menu').addEventListener('click', (e) => { e.stopPropagation(); pop.hidden = !pop.hidden; });
document.addEventListener('click', () => { pop.hidden = true; });
window.addEventListener('blur', () => { pop.hidden = true; }); // a tap inside the page blurs this window

function go(raw) {
  const t = normalize(raw);
  if (!t) return;
  setMedia([]);
  start.hidden = true;
  input.value = t.site || t.query;
  bar.className = '';
  void bar.offsetWidth;
  bar.className = 'on';
  frame.src = t.site ? proxyUrl(t.site) : searchUrl(t.query);
}

function showHome() {
  setMedia([]);
  frame.src = 'about:blank';
  start.hidden = false;
  input.value = '';
  document.title = 'Vrows';
}

const toast = (msg) => {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('on'), 2800);
};

// Where the page is (real address) and what the user last tapped. If a script drags the frame
// out of the proxy (ad hijack, frame-buster), bring the user to what they actually asked for.
let lastUrl = '';
let intent = null;
let recoveries = [];
frame.addEventListener('load', () => {
  bar.className = '';
  if (frame.getAttribute('src') === 'about:blank') return;
  try { void frame.contentWindow.location.href; return; } catch { /* left our origin */ }
  const now = Date.now();
  recoveries = recoveries.filter((t) => now - t < 10000);
  const target = intent && now - intent.at < 5000 ? intent.url : lastUrl;
  if (!target || recoveries.length >= 2) { toast('A redirect to another site was blocked'); return; }
  recoveries.push(now);
  toast('Blocked a redirect to another site');
  go(target);
});

window.addEventListener('message', (e) => {
  if (e.source !== frame.contentWindow || !e.data || !e.data.vp) return;
  if (e.data.vp === 2) { intent = { url: e.data.intent, at: Date.now() }; return; }
  if (e.data.vp === 3) { setMedia(e.data.media); return; }
  bar.className = '';
  lastUrl = e.data.url;
  recordVisit(e.data.url, e.data.title);
  if (document.activeElement !== input) input.value = e.data.url;
  if (e.data.title) document.title = e.data.title;
});

const withFrame = (fn) => () => { try { fn(frame.contentWindow); } catch {} };
$('back').onclick = withFrame((w) => w.history.back());
$('fwd').onclick = withFrame((w) => w.history.forward());
$('reload').onclick = withFrame((w) => w.location.reload());
$('m-home').onclick = showHome;
$('m-dl').onclick = showMedia;
$('m-hist').onclick = showHistory;

input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { go(input.value); input.blur(); } });
input.addEventListener('focus', () => input.select());
document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)));

// The access key is exchanged for an HttpOnly cookie; it is never stored by this page.
async function checkKey() {
  try {
    const r = await fetch('/api/check');
    if (r.status === 401) dlg.showModal();
    else if (r.status === 500) start.querySelector('p').textContent = 'Proxy is not configured yet.';
  } catch {}
}
$('keyform').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('err').textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', body: $('keyin').value.trim() });
    if (r.ok) { dlg.close(); $('keyin').value = ''; }
    else $('err').textContent = r.status === 401 ? 'Wrong key, try again.' : 'Could not sign in.';
  } catch { $('err').textContent = 'Could not reach the server.'; }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
checkKey();
</script>
</body>
</html>
