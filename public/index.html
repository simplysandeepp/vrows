<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vrows</title>
<meta name="theme-color" content="#03040a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #03040a; --glass: rgba(255,255,255,.07); --glass-2: rgba(255,255,255,.12);
    --line: rgba(255,255,255,.14); --text: #eef0ff; --muted: #9ba1c9;
    --accent: #8b7bff; --accent-2: #4fd1ff; --danger: #ff6b81;
    --chrome: rgba(9,11,22,.78);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); overscroll-behavior: none; }
  body {
    color: var(--text); touch-action: manipulation;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  button { font: inherit; color: inherit; background: transparent; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); padding-top: env(safe-area-inset-top); }

  /* Top bar */
  #top { padding: 8px 10px; background: var(--chrome); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); border-bottom: 1px solid var(--line); z-index: 3; }
  .pill { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 14px; border-radius: 22px; background: var(--glass); border: 1px solid var(--line); transition: border-color .2s, box-shadow .2s; }
  .pill:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,123,255,.2); }
  .pill .lead { color: var(--muted); }
  #url { flex: 1; min-width: 0; height: 100%; padding: 0; font: inherit; font-size: 16px; color: var(--text); background: transparent; border: 0; outline: 0; text-overflow: ellipsis; }
  #url::placeholder { color: var(--muted); }
  .pill button.ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .pill button.ic:active { background: var(--glass-2); }
  #bar { height: 2px; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); z-index: 3; }
  #bar.on { width: 75%; transition: width 8s cubic-bezier(.1,.7,.3,1); }

  /* Page area */
  main { flex: 1; position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }

  /* Bottom dock */
  #dock { display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); background: var(--chrome); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); border-top: 1px solid var(--line); z-index: 3; }
  #dock button { height: 48px; border-radius: 14px; display: grid; place-items: center; color: var(--text); position: relative; }
  #dock button:active { background: var(--glass-2); }
  #dock button:disabled { opacity: .35; }
  #dock button.on { color: #ffd166; }
  #dock button.on svg { fill: currentColor; }
  #dlcount { position: absolute; top: 5px; right: calc(50% - 20px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 11px; line-height: 16px; font-weight: 700; text-align: center; }
  #dlcount:empty { display: none; }

  /* Home: glossy black galaxy */
  #start { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 110%, #0b0a22 0%, #04050d 55%, #010208 100%); display: grid; place-items: center; padding: 24px 18px; z-index: 2; }
  #start[hidden] { display: none; }
  #start .core { position: absolute; left: 50%; top: 52%; width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax; pointer-events: none;
    background: conic-gradient(from 0deg, transparent 0 8%, rgba(139,123,255,.30) 16%, transparent 30%, rgba(79,209,255,.20) 46%, transparent 60%, rgba(214,92,255,.22) 76%, transparent 90%);
    filter: blur(70px); opacity: .75; animation: spin 140s linear infinite; mask-image: radial-gradient(closest-side, #000 0 35%, transparent 72%); -webkit-mask-image: radial-gradient(closest-side, #000 0 35%, transparent 72%); }
  #start .haze { position: absolute; inset: 0; pointer-events: none; background:
      radial-gradient(40% 35% at 18% 22%, rgba(120,90,255,.18), transparent 70%),
      radial-gradient(38% 32% at 86% 78%, rgba(40,190,255,.14), transparent 70%),
      radial-gradient(30% 26% at 70% 14%, rgba(255,90,200,.10), transparent 70%); animation: drift 38s ease-in-out infinite alternate; }
  #galaxy { position: absolute; inset: 0; width: 100%; height: 100%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift { from { transform: translate3d(-2%, -1%, 0) scale(1); } to { transform: translate3d(2%, 2%, 0) scale(1.08); } }
  .home { position: relative; width: min(100%, 560px); display: grid; gap: 18px; justify-items: center; text-align: center; margin-top: -4vh; }
  #clock { font-size: clamp(54px, 15vw, 92px); font-weight: 200; letter-spacing: -.03em; line-height: 1; background: linear-gradient(180deg, #fff 10%, rgba(190,198,255,.55)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 40px rgba(139,123,255,.35); }
  #date { color: var(--muted); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; margin-top: -8px; }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: .5em; text-transform: uppercase; color: rgba(255,255,255,.55); margin-bottom: 6px; padding-left: .5em; }
  .search { position: relative; width: 100%; height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 20px; border-radius: 29px; overflow: hidden;
    background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04) 55%, rgba(255,255,255,.08));
    border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.38), inset 0 -10px 24px rgba(0,0,0,.28), 0 24px 70px rgba(0,0,0,.65), 0 0 50px rgba(139,123,255,.22); transition: box-shadow .25s, border-color .25s; }
  .search::before { content: ""; position: absolute; left: -20%; top: -120%; width: 140%; height: 200%; pointer-events: none; transform: rotate(-12deg); background: linear-gradient(180deg, rgba(255,255,255,.22), transparent 55%); }
  .search:focus-within { border-color: rgba(160,150,255,.8); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -10px 24px rgba(0,0,0,.28), 0 24px 70px rgba(0,0,0,.65), 0 0 70px rgba(139,123,255,.45); }
  .search svg { color: rgba(255,255,255,.7); position: relative; }
  #hq { position: relative; flex: 1; min-width: 0; height: 100%; padding: 0; font: inherit; font-size: 17px; color: #fff; background: transparent; border: 0; outline: 0; }
  #hq::placeholder { color: rgba(255,255,255,.5); }
  .go { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--accent), #5d8bff); box-shadow: 0 6px 20px rgba(110,100,255,.5), inset 0 1px 0 rgba(255,255,255,.4); }
  .go:active { transform: scale(.94); }
  #tiles { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 460px; }
  #tiles:empty { display: none; }
  .tile { width: 76px; display: grid; justify-items: center; gap: 6px; color: var(--text); font-size: 12px; }
  .tile .ico { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; font-size: 22px; font-weight: 600; text-transform: uppercase;
    background: linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 10px 30px rgba(0,0,0,.5); backdrop-filter: blur(12px); }
  .tile span.n { max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  body.home #top { display: none; }
  body.home #bar { display: none; }
  body.home #dock { background: rgba(5,6,14,.55); }

  /* Menu */
  #menu-pop { position: fixed; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 66px); z-index: 30; min-width: 230px; padding: 6px; border-radius: 18px; background: rgba(16,18,34,.94); border: 1px solid var(--line); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 18px 60px rgba(0,0,0,.6); }
  #menu-pop[hidden] { display: none; }
  #menu-pop button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 12px; text-align: left; font-size: 15px; border-radius: 12px; }
  #menu-pop button:active, #menu-pop button:hover { background: var(--glass-2); }
  #menu-pop button[hidden] { display: none; }
  #menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

  /* Immersive (fullscreen / rotated) */
  #float { position: absolute; top: calc(env(safe-area-inset-top) + 10px); right: 10px; display: none; gap: 8px; z-index: 20; }
  #float button { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(10,12,24,.7); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  body.immersive #float { display: flex; }
  body.immersive #top, body.immersive #dock, body.immersive #bar { display: none; }
  body.immersive #app { padding-top: 0; }
  body.rotated #app { inset: auto; top: 0; left: 100%; width: 100vh; width: 100dvh; height: 100vw; height: 100dvw; transform-origin: 0 0; transform: rotate(90deg); padding: 0; }

  /* Dialogs */
  dialog { border: 1px solid var(--line); border-radius: 22px; background: rgba(14,16,30,.97); color: var(--text); padding: 20px; width: min(92vw, 400px); box-shadow: 0 30px 90px rgba(0,0,0,.7); }
  dialog::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  dialog h2 { margin: 0 0 4px; font-size: 19px; }
  dialog p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  dialog input[type=text], dialog input[type=search], dialog input[type=password] { width: 100%; height: 46px; padding: 0 14px; font: inherit; color: var(--text); background: var(--glass); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
  .btn { height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); font-size: 15px; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), #5d8bff); border-color: transparent; color: #fff; font-weight: 600; }
  .row2 { display: flex; gap: 8px; } .row2 .btn { flex: 1; }
  ul.list { list-style: none; margin: 0 0 12px; padding: 0; max-height: 52vh; overflow: auto; }
  ul.list .day { margin: 10px 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  ul.list li.row { display: flex; align-items: center; gap: 4px; border-radius: 12px; }
  ul.list li.row:hover { background: var(--glass); }
  ul.list .open { flex: 1; min-width: 0; padding: 9px 8px; text-align: left; font-size: 14px; border-radius: 12px; }
  ul.list .t, ul.list .s { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.list .s { color: var(--muted); font-size: 12px; }
  ul.list .del { flex: none; width: 36px; height: 36px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
  .empty { color: var(--muted); text-align: center; margin: 24px 0; font-size: 14px; list-style: none; }
  .offrow { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .offrow input { width: 18px; height: 18px; accent-color: var(--accent); }
  #dllist li { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  #dllist .name { font-size: 14px; word-break: break-all; }
  #dllist .meta { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
  #dllist .acts { display: flex; gap: 8px; }
  #dllist a, #dllist button { height: auto; padding: 9px 14px; font-size: 14px; border-radius: 10px; text-decoration: none; border: 1px solid var(--line); color: var(--text); background: var(--glass); }
  #dllist a.primary { background: linear-gradient(135deg, var(--accent), #5d8bff); border-color: transparent; color: #fff; }
  progress { width: 100%; height: 10px; border-radius: 6px; overflow: hidden; accent-color: var(--accent); margin: 4px 0 8px; }
  #hlsq { display: grid; gap: 8px; margin-bottom: 12px; max-height: 46vh; overflow: auto; }
  #hlsq .btn { text-align: left; display: flex; justify-content: space-between; gap: 12px; }
  #hlsq .btn small { color: var(--muted); }
  #hlsmsg { min-height: 20px; }
  #err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 0 0 8px; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); transform: translate(-50%, 20px); max-width: 90vw; padding: 10px 16px; background: rgba(240,242,255,.95); color: #0b0d1a; border-radius: 14px; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 40; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { #start .core, #start .haze { animation: none; } }
</style>
</head>

  <defs>

<div id="app">
  <header id="top">
    <div class="pill">
      <svg class="i lead" id="lead"><use href="#i-globe"/></svg>
      <input id="url" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search or enter address" aria-label="Address">
      <button class="ic" id="reload" aria-label="Reload"><svg class="i"><use href="#i-reload"/></svg></button>
    </div>
  </header>
  <div id="bar"></div>
  <main>
    <iframe id="frame" title="Page" allow="fullscreen; autoplay; picture-in-picture" allowfullscreen referrerpolicy="same-origin" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"></iframe>
    <section id="start">
      <div class="core"></div><div class="haze"></div>
      <canvas id="galaxy" aria-hidden="true"></canvas>
      <div class="home">
        <div class="brand">Vrows</div>
        <div id="clock">--:--</div>
        <div id="date"></div>
        <form class="search" id="hform" autocomplete="off">
          <svg class="i"><use href="#i-search"/></svg>
          <input id="hq" type="text" inputmode="url" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search or enter address" aria-label="Search or enter address">
          <button class="go" type="submit" aria-label="Go"><svg class="i"><use href="#i-arrow"/></svg></button>
        </form>
        <div id="tiles"></div>
      </div>

  <nav id="dock" aria-label="Browser controls">

    <button id="f-rotate" aria-label="Rotate"><svg class="i"><use href="#i-rotate"/></svg></button>

</div>

<div id="menu-pop" role="menu" hidden>
  <button id="m-dl" role="menuitem" hidden><svg class="i"><use href="#i-download"/></svg>Save media from this page</button>
  <button id="m-full" role="menuitem"><svg class="i"><use href="#i-full"/></svg>Full screen</button>
  <button id="m-rotate" role="menuitem"><svg class="i"><use href="#i-rotate"/></svg>Rotate (landscape)</button>
  <hr>
  <button id="m-bm" role="menuitem"><svg class="i"><use href="#i-bookmark"/></svg>Bookmarks</button>
  <button id="m-hist" role="menuitem"><svg class="i"><use href="#i-history"/></svg>History</button>

  <button id="m-share" role="menuitem"><svg class="i"><use href="#i-share"/></svg>Share</button>
  <button id="m-copy" role="menuitem"><svg class="i"><use href="#i-copy"/></svg>Copy link</button>
</div>

  <ul class="list" id="dllist"></ul>
  <button class="btn" id="dlclose" type="button" style="width:100%">Close</button>

<script>
const $ = (id) => document.getElementById(id);
const body = document.body;
const frame = $('frame'), input = $('url'), start = $('start'), bar = $('bar'), keyDlg = $('keydlg');
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const readJson = (k) => { try { const a = JSON.parse(store.get(k) || '[]'); return Array.isArray(a) ? a : []; } catch { return []; } };
const icon = (id) => {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'i');
  const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  u.setAttribute('href', '#i-' + id);
  s.append(u);
  return s;
};

const proxyUrl = (u) => {
  const x = new URL(u);
  return '/p/' + x.protocol.slice(0, -1) + '/' + x.host + x.pathname + x.search + x.hash;
};
const searchUrl = (q) => '/api/search?q=' + encodeURIComponent(q);
const isWeb = (u) => /^https?:\/\//i.test(u || '');
const hostOf = (u) => { try { const x = new URL(u); return x.host + (x.pathname !== '/' ? x.pathname : ''); } catch { return u; } };

const toast = (msg) => {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('on'), 2400);
};

/* ---------- Navigation ---------- */
function normalize(v) {
  v = v.trim();
  if (!v) return null;
  if (/^https?:\/\//i.test(v)) return { site: v };
  if (!/\s/.test(v) && /^[^\s/]+\.[^\s/]{2,}(\/.*)?$/.test(v)) return { site: 'https://' + v };
  return { query: v };
}

let curUrl = '', curTitle = '', loading = false;

let loadTimer = 0;
function setLoading(on) {
  loading = on;
  clearTimeout(loadTimer);
  if (on) loadTimer = setTimeout(() => setLoading(false), 20000); // never leave it spinning
  $('reload').querySelector('use').setAttribute('href', on ? '#i-stop' : '#i-reload');
  $('reload').setAttribute('aria-label', on ? 'Stop' : 'Reload');
  bar.className = '';
  if (on) { void bar.offsetWidth; bar.className = 'on'; }
}

function setHome(on) {
  body.classList.toggle('home', on);
  start.hidden = !on;
  galaxy.run(on);
  updateBookmarkButton();
}

function go(raw) {
  const t = normalize(raw);
  if (!t) return;
  setMedia([]);
  setHome(false);
  input.value = t.site || t.query;
  curUrl = '';
  curTitle = '';
  setLoading(true);
  frame.src = t.site ? proxyUrl(t.site) : searchUrl(t.query);
}

function showHome() {
  exitImmersive();
  setMedia([]);
  frame.src = 'about:blank';
  input.value = '';
  curUrl = '';
  document.title = 'Vrows';
  setLoading(false);
  setHome(true);
  renderTiles();
}

const withFrame = (fn) => () => { try { fn(frame.contentWindow); } catch {} };
$('back').onclick = withFrame((w) => w.history.back());
$('fwd').onclick = withFrame((w) => w.history.forward());
$('reload').onclick = withFrame((w) => {
  if (loading) { w.stop(); setLoading(false); }
  else { setLoading(true); w.location.reload(); }
});
$('m-home').onclick = showHome;

input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { go(input.value); input.blur(); } });
input.addEventListener('focus', () => input.select());
$('hform').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('hq').value;
  $('hq').blur();
  go(v);
  $('hq').value = '';
});

/* ---------- Page <-> shell messages, escape recovery ---------- */
let intent = null;
let recoveries = [];
frame.addEventListener('load', () => {
  setLoading(false);
  if (frame.getAttribute('src') === 'about:blank') return;
  try { void frame.contentWindow.location.href; return; } catch { /* left our origin */ }
  const now = Date.now();
  recoveries = recoveries.filter((t) => now - t < 10000);
  const target = intent && now - intent.at < 5000 ? intent.url : curUrl;
  if (!target || recoveries.length >= 2) { toast('A redirect to another site was blocked'); return; }
  recoveries.push(now);
  toast('Blocked a redirect to another site');
  go(target);
});

window.addEventListener('message', (e) => {
  if (e.source !== frame.contentWindow || !e.data || !e.data.vp) return;
  if (e.data.vp === 2) { intent = { url: e.data.intent, at: Date.now() }; return; }
  if (e.data.vp === 3) { setMedia(e.data.media); return; }
  if (e.data.vp === 4) { setLoading(true); return; }
  curUrl = e.data.url || '';
  curTitle = e.data.title || '';
  if (document.activeElement !== input) input.value = curUrl;
  if (curTitle) document.title = curTitle;
  $('lead').querySelector('use').setAttribute('href', curUrl.startsWith('https:') ? '#i-lock' : '#i-globe');
  recordVisit(curUrl, curTitle);
  updateBookmarkButton();
});

/* ---------- History (localStorage) ---------- */
const HKEY = 'vrows-history', HOFF = 'vrows-history-off', HMAX = 500;
const saveHistory = (a) => store.set(HKEY, JSON.stringify(a.slice(0, HMAX)));

function recordVisit(url, title) {
  if (!url || store.get(HOFF) === '1') return;
  const a = readJson(HKEY);
  const now = Date.now();
  if (a[0] && a[0].u === url) {
    if (title) a[0].t = title;
    a[0].at = now;
  } else {
    a.unshift({ u: url, t: title || '', at: now, s: isWeb(url) ? 0 : 1 });
  }
  saveHistory(a);
}

function dayLabel(ts) {
  const day = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const diff = Math.round((day(new Date()) - day(new Date(ts))) / 864e5);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}

function listRow({ title, sub, onOpen, onDelete }) {
  const li = document.createElement('li');
  li.className = 'row';
  const open = document.createElement('button');
  open.type = 'button';
  open.className = 'open';
  const t = document.createElement('span');
  t.className = 't';
  t.textContent = title;
  const s = document.createElement('span');
  s.className = 's';
  s.textContent = sub;
  open.append(t, s);
  open.onclick = onOpen;
  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'del';
  del.setAttribute('aria-label', 'Remove');
  del.append(icon('x'));
  del.onclick = onDelete;
  li.append(open, del);
  return li;
}

function renderHistory() {
  const q = $('histq').value.trim().toLowerCase();
  const ul = $('histlist');
  ul.replaceChildren();
  const items = readJson(HKEY).filter((e) => !q || (e.t + ' ' + e.u).toLowerCase().includes(q)).slice(0, 200);
  if (!items.length) {
    const p = document.createElement('li');
    p.className = 'empty';
    p.textContent = q ? 'Nothing matches.' : 'No history yet.';
    ul.append(p);
    return;
  }
  let lastDay = '';
  for (const e of items) {
    const label = dayLabel(e.at);
    if (label !== lastDay) {
      const d = document.createElement('li');
      d.className = 'day';
      d.textContent = label;
      ul.append(d);
      lastDay = label;
    }
    ul.append(listRow({
      title: e.s ? e.u : e.t || hostOf(e.u),
      sub: (e.s ? 'Search' : hostOf(e.u)) + ' · ' + new Date(e.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      onOpen: () => { $('histdlg').close(); go(e.u); },
      onDelete: () => { saveHistory(readJson(HKEY).filter((x) => !(x.at === e.at && x.u === e.u))); renderHistory(); },
    }));
  }
}

function showHistory() {
  $('histq').value = '';
  $('histoff').checked = store.get(HOFF) === '1';
  renderHistory();
  $('histdlg').showModal();
}
$('histq').addEventListener('input', renderHistory);
$('histoff').addEventListener('change', (e) => store.set(HOFF, e.target.checked ? '1' : '0'));
$('histclose').onclick = () => $('histdlg').close();
$('histclear').onclick = () => {
  if (!readJson(HKEY).length || !confirm('Clear all history?')) return;
  saveHistory([]);
  renderHistory();
  toast('History cleared');
};
$('m-hist').onclick = showHistory;

/* ---------- Bookmarks (localStorage) ---------- */
const BKEY = 'vrows-bookmarks';
const saveBookmarks = (a) => store.set(BKEY, JSON.stringify(a.slice(0, 200)));
const isBookmarked = (u) => !!u && readJson(BKEY).some((b) => b.u === u);

function updateBookmarkButton() {
  const on = isBookmarked(curUrl);
  $('bm').classList.toggle('on', on);
  $('bm').disabled = body.classList.contains('home') || !isWeb(curUrl);
  $('bm').setAttribute('aria-label', on ? 'Remove bookmark' : 'Bookmark this page');
}

function toggleBookmark() {
  if (!isWeb(curUrl)) return;
  const a = readJson(BKEY);
  const i = a.findIndex((b) => b.u === curUrl);
  if (i >= 0) { a.splice(i, 1); toast('Bookmark removed'); }
  else { a.unshift({ u: curUrl, t: curTitle || hostOf(curUrl), at: Date.now() }); toast('Bookmarked'); }
  saveBookmarks(a);
  updateBookmarkButton();
}
$('bm').onclick = toggleBookmark;

function renderBookmarks() {
  const ul = $('bmlist');
  ul.replaceChildren();
  const items = readJson(BKEY);
  if (!items.length) {
    const p = document.createElement('li');
    p.className = 'empty';
    p.textContent = 'Tap the star while on a page to save it here.';
    ul.append(p);
    return;
  }
  for (const b of items) {
    ul.append(listRow({
      title: b.t || hostOf(b.u),
      sub: hostOf(b.u),
      onOpen: () => { $('bmdlg').close(); go(b.u); },
      onDelete: () => { saveBookmarks(readJson(BKEY).filter((x) => x.u !== b.u)); renderBookmarks(); renderTiles(); updateBookmarkButton(); },
    }));
  }
}
$('m-bm').onclick = () => { renderBookmarks(); $('bmdlg').showModal(); };
$('bmclose').onclick = () => $('bmdlg').close();

function renderTiles() {
  const box = $('tiles');
  box.replaceChildren();
  for (const b of readJson(BKEY).slice(0, 8)) {
    const a = document.createElement('button');
    a.type = 'button';
    a.className = 'tile';
    const ico = document.createElement('div');
    ico.className = 'ico';
    let host = b.u;
    try { host = new URL(b.u).hostname.replace(/^www\./, ''); } catch {}
    ico.textContent = host[0] || '?';
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = host;
    a.append(ico, n);
    a.onclick = () => go(b.u);
    box.append(a);
  }
}

/* ---------- Share / copy ---------- */
async function copyText(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); } catch { toast('Could not copy'); }
}
$('m-copy').onclick = () => { if (isWeb(curUrl)) copyText(curUrl, 'Link copied'); else toast('Open a page first'); };
$('m-share').onclick = async () => {
  if (!isWeb(curUrl)) { toast('Open a page first'); return; }
  if (navigator.share) { try { await navigator.share({ title: curTitle || 'Vrows', url: curUrl }); } catch {} }
  else copyText(curUrl, 'Link copied');
};

/* ---------- Full screen and rotate (for video) ---------- */
let fsActive = false;
async function enterImmersive() {
  body.classList.add('immersive');
  try {
    if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
      fsActive = true;
    }
  } catch { /* no Fullscreen API here (e.g. iPhone): the immersive layout still hides the bars */ }
}
function exitImmersive() {
  body.classList.remove('immersive', 'rotated');
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch {}
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  fsActive = false;
}
async function toggleRotate() {
  if (body.classList.contains('rotated')) { body.classList.remove('rotated'); return; }
  try {
    if (screen.orientation && screen.orientation.lock && document.fullscreenElement) {
      await screen.orientation.lock(screen.orientation.type.startsWith('landscape') ? 'portrait' : 'landscape');
      return;
    }
  } catch { /* orientation lock not allowed: rotate the layout instead */ }
  body.classList.add('rotated');
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && fsActive) exitImmersive(); });
$('m-full').onclick = enterImmersive;
$('m-rotate').onclick = async () => { await enterImmersive(); toggleRotate(); };
$('f-rotate').onclick = toggleRotate;
$('f-exit').onclick = exitImmersive;

/* ---------- Menu ---------- */
const pop = $('menu-pop');
$('menu').addEventListener('click', (e) => { e.stopPropagation(); pop.hidden = !pop.hidden; });
document.addEventListener('click', () => { pop.hidden = true; });
window.addEventListener('blur', () => { pop.hidden = true; }); // a tap inside the page blurs this window

/* ---------- Plain media files found on the page ---------- */
let media = [];
function setMedia(list) {
  let items = Array.isArray(list) ? list.filter((m) => m && typeof m.url === 'string') : [];
  // when a page offers a master playlist, its individual quality playlists are not shown separately
  if (items.some((m) => m.kind === 'hls' && m.master)) items = items.filter((m) => m.kind !== 'hls' || m.master);
  media = items;
  $('m-dl').hidden = media.length === 0;
  $('dlcount').textContent = media.length || '';
}
function fileName(u, kind) {
  try {
    const n = decodeURIComponent(new URL(u).pathname.split('/').filter(Boolean).pop() || '');
    if (n) return n;
  } catch {}
  return kind === 'audio' ? 'audio' : 'video';
}
const fmtSize = (n) => (n > 1e9 ? (n / 1e9).toFixed(2) + ' GB' : n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : n > 1e3 ? Math.round(n / 1e3) + ' KB' : '');
const safeName = (s, fallback) => (s || fallback).replace(/[^\p{L}\p{N}\-_ ]+/gu, '').trim().slice(0, 60) || fallback;
// Proxied address that also tells the server which page it came from (many CDNs check the referer)
const withPage = (u) => { const p = proxyUrl(u); return p + (p.includes('?') ? '&' : '?') + '__vrp=' + encodeURIComponent(curUrl || u); };

function showMedia() {
  const ul = $('dllist');
  ul.replaceChildren();
  for (const m of media) {
    const li = document.createElement('li');
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = (m.label ? m.label + (/^\d+$/.test(m.label) ? 'p · ' : ' · ') : '') + fileName(m.url, m.kind);
    const meta = document.createElement('div');
    meta.className = 'meta';
    const size = m.size ? ' · ' + fmtSize(m.size) : '';
    meta.textContent = m.kind === 'hls' ? 'Streaming video (saved as an MP4)' : (m.kind === 'audio' ? 'Audio file' : 'Video file') + size;
    const acts = document.createElement('div');
    acts.className = 'acts';
    if (m.kind === 'hls') {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'primary';
      b.textContent = 'Download';
      b.onclick = () => { $('dldlg').close(); startHls(m.url); };
      b.style.cssText = 'background:linear-gradient(135deg,var(--accent),#5d8bff);border-color:transparent;color:#fff';
      acts.append(b);
    } else {
      const a = document.createElement('a');
      a.className = 'primary';
      a.textContent = 'Download';
      a.href = withPage(m.url);
      a.download = fileName(m.url, m.kind);
      acts.append(a);
    }
    const copy = document.createElement('button');
    copy.type = 'button';
    copy.textContent = 'Copy link';
    copy.onclick = () => copyText(m.url, 'Link copied');
    acts.append(copy);
    li.append(name, meta, acts);
    ul.append(li);
  }
  $('dldlg').showModal();
}

/* ---------- Streaming (HLS) download: fetch the pieces and join them in the browser ---------- */
let hlsCtrl = null;
const attrs = (s) => { const o = {}; s.replace(/([A-Z0-9-]+)=("[^"]*"|[^,]*)/g, (m, k, v) => { o[k] = v.replace(/^"|"$/g, ''); }); return o; };
async function getRes(u, signal, range, tries = 3) {
  let err;
  const opts = { signal };
  if (range) opts.headers = { Range: `bytes=${range.start}-${range.end}` };
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(withPage(u), opts);
      if (r.ok) return r;
      err = new Error('HTTP ' + r.status);
    } catch (e) { if (e.name === 'AbortError') throw e; err = e; }
    await new Promise((res) => setTimeout(res, 400 * (i + 1)));
  }
  throw err;
}
const getText = async (u, signal) => (await getRes(u, signal)).text();
const getBytes = async (u, signal, range) => new Uint8Array(await (await getRes(u, signal, range)).arrayBuffer());

function parseMaster(text, base) {
  const lines = text.split(/\r?\n/).map((l) => l.trim());
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    if (!lines[i].startsWith('#EXT-X-STREAM-INF:')) continue;
    const a = attrs(lines[i].slice(18));
    let j = i + 1;
    while (j < lines.length && (!lines[j] || lines[j].startsWith('#'))) j++;
    if (lines[j]) out.push({ url: new URL(lines[j], base).href, bw: +a.BANDWIDTH || 0, res: a.RESOLUTION || '' });
  }
  return out.sort((x, y) => y.bw - x.bw);
}

const parseRange = (s, prevEnd) => {
  const [len, off] = String(s).replace(/"/g, '').split('@');
  const start = off === undefined ? prevEnd || 0 : +off;
  return { start, end: start + +len - 1 };
};

function parsePlaylist(text, base) {
  const lines = text.split(/\r?\n/).map((l) => l.trim());
  let seq = 0, key = null, map = null;
  const segs = [];
  const ends = {}; // where the previous byte range of each file stopped
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith('#EXT-X-MEDIA-SEQUENCE:')) seq = parseInt(l.split(':')[1], 10) || 0;
    else if (l.startsWith('#EXT-X-KEY:')) {
      const a = attrs(l.slice(11));
      if (a.METHOD === 'NONE') key = null;
      else if (a.METHOD === 'AES-128') key = { uri: new URL(a.URI, base).href, iv: a.IV || null };
      else throw new Error('This video is protected and cannot be saved.');
    } else if (l.startsWith('#EXT-X-MAP:')) {
      const a = attrs(l.slice(11));
      const url = new URL(a.URI, base).href;
      map = { url, range: a.BYTERANGE ? parseRange(a.BYTERANGE, ends[url]) : null };
      if (map.range) ends[url] = map.range.end + 1;
    } else if (l.startsWith('#EXTINF:')) {
      let j = i + 1, br = null;
      while (j < lines.length && (!lines[j] || lines[j].startsWith('#'))) {
        if (lines[j].startsWith('#EXT-X-BYTERANGE:')) br = lines[j].slice(17);
        j++;
      }
      if (lines[j]) {
        const url = new URL(lines[j], base).href;
        const range = br ? parseRange(br, ends[url]) : null;
        if (range) ends[url] = range.end + 1;
        segs.push({ url, range, key, seq: seq + segs.length });
      }
      i = j;
    }
  }
  return { segs, map };
}

async function decryptSegment(bytes, seg, keys, signal) {
  if (!seg.key) return bytes;
  let ck = keys.get(seg.key.uri);
  if (!ck) {
    ck = await crypto.subtle.importKey('raw', await getBytes(seg.key.uri, signal), 'AES-CBC', false, ['decrypt']);
    keys.set(seg.key.uri, ck);
  }
  const iv = new Uint8Array(16);
  if (seg.key.iv) {
    const hex = seg.key.iv.replace(/^0x/i, '').padStart(32, '0');
    for (let i = 0; i < 16; i++) iv[i] = parseInt(hex.substr(i * 2, 2), 16);
  } else new DataView(iv.buffer).setUint32(12, seg.seq);
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, ck, bytes));
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('script'));
    document.head.append(s);
  });
}
// MPEG-TS pieces play in few apps; re-wrapping them as MP4 plays almost everywhere
async function tsToMp4(parts) {
  if (!window.muxjs) await loadScript('https://cdn.jsdelivr.net/npm/mux.js@6.3.0/dist/mux.min.js');
  return new Promise((resolve, reject) => {
    const tm = new window.muxjs.mp4.Transmuxer({ keepOriginalTimestamps: true });
    const chunks = [];
    let init = false;
    const t = setTimeout(() => reject(new Error('timeout')), 60000);
    tm.on('data', (s) => { if (!init) { chunks.push(s.initSegment); init = true; } chunks.push(s.data); });
    tm.on('done', () => { clearTimeout(t); chunks.length > 1 ? resolve(new Blob(chunks, { type: 'video/mp4' })) : reject(new Error('empty')); });
    try { for (const p of parts) tm.push(p); tm.flush(); } catch (e) { clearTimeout(t); reject(e); }
  });
}

function saveBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
}

function hlsUi({ title, msg, progress, choices }) {
  if (title !== undefined) $('hlstitle').textContent = title;
  if (msg !== undefined) $('hlsmsg').textContent = msg;
  $('hlsbar').hidden = progress === undefined;
  if (progress !== undefined) $('hlsbar').value = progress;
  const q = $('hlsq');
  q.replaceChildren();
  for (const c of choices || []) q.append(c);
  $('hlscancel').textContent = choices ? 'Cancel' : 'Stop';
}

async function startHls(url) {
  hlsCtrl = new AbortController();
  const signal = hlsCtrl.signal;
  $('hlsdlg').showModal();
  hlsUi({ title: 'Preparing…', msg: 'Reading the video list', progress: undefined });
  try {
    const text = await getText(url, signal);
    if (!/^\s*#EXTM3U/.test(text)) throw new Error('This is not a video stream.');
    const variants = parseMaster(text, url);
    if (variants.length > 1) {
      const buttons = variants.map((v) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn';
        const left = document.createElement('span');
        left.textContent = v.res ? v.res.split('x')[1] + 'p' : 'Video';
        const right = document.createElement('small');
        right.textContent = v.bw ? (v.bw / 1e6).toFixed(1) + ' Mbps' : '';
        b.append(left, right);
        b.onclick = () => downloadHls(v.url, null);
        return b;
      });
      hlsUi({ title: 'Choose quality', msg: 'Higher quality means a bigger file.', choices: buttons });
    } else {
      await downloadHls(variants[0] ? variants[0].url : url, text);
    }
  } catch (e) {
    if (e.name !== 'AbortError') hlsUi({ title: 'Could not download', msg: e.message || 'Something went wrong.', choices: [] });
  }
}

async function downloadHls(playlistUrl, knownText) {
  const signal = hlsCtrl.signal;
  try {
    hlsUi({ title: 'Downloading…', msg: 'Starting', progress: 0 });
    const text = knownText && !/#EXT-X-STREAM-INF/.test(knownText) ? knownText : await getText(playlistUrl, signal);
    const { segs, map } = parsePlaylist(text, playlistUrl);
    if (!segs.length) throw new Error('No video found in this stream.');
    const parts = new Array(segs.length);
    const keys = new Map();
    const mapBytes = map ? await getBytes(map.url, signal, map.range) : null;
    let next = 0, done = 0, total = 0;
    const lane = async () => {
      while (next < segs.length) {
        const i = next++;
        let b = await getBytes(segs[i].url, signal, segs[i].range);
        b = await decryptSegment(b, segs[i], keys, signal);
        parts[i] = b;
        total += b.length;
        done++;
        hlsUi({ title: 'Downloading…', msg: `${done} of ${segs.length} parts · ${fmtSize(total)}`, progress: (done / segs.length) * 100 });
      }
    };
    await Promise.all(Array.from({ length: 4 }, lane));

    hlsUi({ title: 'Finishing…', msg: 'Preparing the file', progress: 100 });
    let blob, ext = 'mp4';
    if (mapBytes) blob = new Blob([mapBytes, ...parts], { type: 'video/mp4' });
    else {
      try { blob = await tsToMp4(parts); } catch { blob = null; }
      if (!blob) { blob = new Blob(parts, { type: 'video/mp2t' }); ext = 'ts'; }
    }
    saveBlob(blob, safeName(curTitle, 'video') + '.' + ext);
    hlsUi({ title: 'Saved', msg: ext === 'ts' ? 'Saved as a .ts file (play it with VLC).' : 'Your video was saved.', choices: [] });
    $('hlscancel').textContent = 'Close';
  } catch (e) {
    if (e.name !== 'AbortError') hlsUi({ title: 'Could not download', msg: e.message || 'Something went wrong.', choices: [] });
  }
}
$('hlscancel').onclick = () => { if (hlsCtrl) hlsCtrl.abort(); $('hlsdlg').close(); };
$('hlsdlg').addEventListener('close', () => { if (hlsCtrl) hlsCtrl.abort(); });

$('m-dl').onclick = showMedia;
$('dlclose').onclick = () => $('dldlg').close();

/* ---------- Optional access key ---------- */
async function checkKey() {
  try {
    const r = await fetch('/api/check');
    if (r.status === 401) keyDlg.showModal();
  } catch {}
}
$('keyform').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('err').textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', body: $('keyin').value.trim() });
    if (r.ok) { keyDlg.close(); $('keyin').value = ''; }
    else $('err').textContent = r.status === 401 ? 'Wrong key, try again.' : 'Could not sign in.';
  } catch { $('err').textContent = 'Could not reach the server.'; }
});

/* ---------- Home: clock and galaxy ---------- */
function tick() {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
  $('date').textContent = d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
}
tick();
setInterval(tick, 20000);

const galaxy = (() => {
  const cv = $('galaxy'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w = 0, h = 0, stars = [], shoot = null, nextShoot = 0, raf = 0, running = false;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    if (!w || !h) return;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(340, (w * h) / 4200));
    stars = Array.from({ length: n }, () => {
      const z = Math.random() ** 2 * 0.9 + 0.1;
      const r = Math.random();
      return { x: Math.random() * w, y: Math.random() * h, z, tw: Math.random() * 6.28, hue: r < 0.18 ? 195 + Math.random() * 40 : r < 0.3 ? 275 + Math.random() * 50 : 225 };
    });
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      if (!reduce) { s.x += s.z * 0.05; if (s.x > w + 2) s.x = -2; }
      const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.tw + t * 0.0014 * (0.4 + s.z)));
      const r = 0.3 + s.z * 1.25;
      ctx.fillStyle = `hsla(${s.hue},90%,${80 + s.z * 15}%,${a * (0.35 + s.z * 0.65)})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.2832); ctx.fill();
      if (s.z > 0.82) {
        const gr = r * 7;
        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, gr);
        g.addColorStop(0, `hsla(${s.hue},100%,85%,${a * 0.35})`); g.addColorStop(1, `hsla(${s.hue},100%,80%,0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(s.x, s.y, gr, 0, 6.2832); ctx.fill();
      }
    }
    if (reduce) return;
    if (!shoot && t > nextShoot) {
      shoot = { x: Math.random() * w * 0.8, y: Math.random() * h * 0.4, vx: 5 + Math.random() * 3, vy: 2.2 + Math.random() * 1.6, life: 0 };
      nextShoot = t + 5000 + Math.random() * 7000;
    }
    if (shoot) {
      shoot.x += shoot.vx; shoot.y += shoot.vy; shoot.life += 1;
      const f = 1 - shoot.life / 60;
      const g = ctx.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx * 14, shoot.y - shoot.vy * 14);
      g.addColorStop(0, `rgba(255,255,255,${0.9 * f})`); g.addColorStop(1, 'rgba(160,170,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x - shoot.vx * 14, shoot.y - shoot.vy * 14); ctx.stroke();
      if (shoot.life >= 60) shoot = null;
    }
  }

  function loop(t) {
    if (!running) return;
    draw(t);
    raf = requestAnimationFrame(loop);
  }

  function run(on) {
    if (on && !running) {
      running = true;
      resize();
      if (reduce) draw(0); else raf = requestAnimationFrame(loop);
    } else if (!on) {
      running = false;
      cancelAnimationFrame(raf);
    }
  }
  window.addEventListener('resize', () => { if (running) { resize(); if (reduce) draw(0); } });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else if (running && !reduce) raf = requestAnimationFrame(loop);
  });
  return { run };
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
galaxy.run(true);
renderTiles();
updateBookmarkButton();
checkKey();
</script>
